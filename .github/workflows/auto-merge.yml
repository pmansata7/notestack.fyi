# Label-gated squash merge for Cursor Cloud Agent "ship" flow.
#
# Label `auto-merge` from `<!-- auto-ship -->` is applied and merged by
# `.github/workflows/auto-ship-marker.yml` in one run (bot labels do not fire
# `pull_request: labeled`). This workflow handles human-applied `auto-merge` /
# `ship` labels and `workflow_dispatch`.
# This workflow waits for PR checks to finish, refuses merge when CI fails or a
# review has CHANGES_REQUESTED, then runs `gh pr merge --squash`.
#
# Does not use repository secrets — only the default GITHUB_TOKEN.
# Repo setting: Settings → General → Pull Requests → Allow auto-merge (optional;
# this workflow merges directly when gates pass, without GitHub's auto-merge queue).

name: Auto-merge labeled PR

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to merge
        required: true
        type: string

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
    steps:
      - name: Check merge label
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          body="$(gh pr view "$PR" --json body -q .body)"
          head_ref="$(gh pr view "$PR" --json headRefName -q .headRefName)"
          if grep -qF '<!-- auto-ship -->' <<< "$body" || [[ "$head_ref" == cursor/* ]]; then
            echo "PR is auto-ship / Cloud Agent; merge handled by auto-ship-marker workflow."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh pr view "$PR" --json labels -q '.labels[].name' | grep -qxE '^(auto-merge|ship)$'; then
            echo "PR #${PR} has no auto-merge or ship label; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Auto-merge label present on PR #${PR}"

      - uses: actions/checkout@v4
        if: steps.label.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Merge when checks pass
        if: steps.label.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail

          echo "Auto-merge requested for PR #${PR}"

          bash scripts/wait-for-external-pr-checks.sh "$PR"

          decision="$(gh pr view "$PR" --json reviewDecision -q .reviewDecision)"
          if [ "$decision" = "CHANGES_REQUESTED" ]; then
            echo "A review requested changes; not merging."
            exit 1
          fi

          mergeable="$(gh pr view "$PR" --json mergeable -q .mergeable)"
          if [ "$mergeable" != "MERGEABLE" ]; then
            echo "PR is not mergeable (mergeable=${mergeable})."
            exit 1
          fi

          state="$(gh pr view "$PR" --json mergeStateStatus -q .mergeStateStatus)"
          case "$state" in
            CLEAN|HAS_HOOKS|UNSTABLE)
              echo "mergeStateStatus=${state}; proceeding (mergeable=${mergeable})."
              ;;
            BEHIND|DIRTY|BLOCKED)
              echo "mergeStateStatus=${state}; not merging."
              exit 1
              ;;
            *)
              echo "mergeStateStatus=${state}; not merging."
              exit 1
              ;;
          esac

          gh pr merge "$PR" --squash --delete-branch
          echo "Merged PR #${PR} (squash)."
