# Keeps the Supabase project active on the free tier (pauses after ~7 days of inactivity).
# Requires repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL          — e.g. https://YOUR_PROJECT_REF.supabase.co (NoteStack production)
#   SUPABASE_ANON_KEY     — Supabase Dashboard → Project Settings → API → publishable or legacy anon key

name: Supabase heartbeat

on:
  schedule:
    - cron: "0 14 * * *" # daily 14:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing required secrets: SUPABASE_URL and SUPABASE_ANON_KEY."
            echo "Add them under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

          url="${SUPABASE_URL%/}/auth/v1/health"

          http_code="$(curl -fS -o /tmp/supabase-heartbeat-body.txt -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${url}")" || {
            echo "GET ${url} failed (curl -f; expected HTTP 200)."
            exit 1
          }

          echo "GET ${url} → HTTP ${http_code}"
          head -c 500 /tmp/supabase-heartbeat-body.txt 2>/dev/null || true
          echo

          if [ "${http_code}" != "200" ]; then
            echo "Supabase heartbeat failed (expected HTTP 200)."
            exit 1
          fi

          echo "Supabase heartbeat OK."
