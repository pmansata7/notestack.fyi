# Keeps the Supabase project active on the free tier (pauses after ~7 days of inactivity).
# Requires repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL          — e.g. https://grumkbutrbggnilwicfw.supabase.co (InsightStack production)
#   SUPABASE_ANON_KEY     — Supabase Dashboard → Project Settings → API → anon public (preferred, minimal scope)
# Optional instead of anon: SUPABASE_SERVICE_ROLE_KEY (not used by this workflow unless you change the env var below)

name: Supabase heartbeat

on:
  schedule:
    - cron: "0 14 * * *" # daily 14:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing required secrets: SUPABASE_URL and SUPABASE_ANON_KEY."
            echo "Add them under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

          url="${SUPABASE_URL%/}/rest/v1/"
          http_code="$(curl -sS -o /tmp/supabase-heartbeat-body.txt -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${url}")"

          echo "GET ${url} → HTTP ${http_code}"
          head -c 500 /tmp/supabase-heartbeat-body.txt 2>/dev/null || true
          echo

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "Supabase heartbeat failed (expected 2xx)."
            exit 1
          fi

          echo "Supabase heartbeat OK."
