# Build and typecheck the marketing site on pull requests to main.
# Automated testing: `npm run build` runs `tsc -b` (project references) plus Vite production build.

name: Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/web/package-lock.json'
      - '.github/workflows/web-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + Vite)
        run: npm run build
