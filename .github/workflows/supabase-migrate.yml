# Production Database deploy on push to main when supabase/migrations/ changes.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   DIRECT_URL — Supabase session pooler URI, port 5432.
#
# Optional (local `supabase link` only — not used in CI with --db-url):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD

name: Database deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate DIRECT_URL secret
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [[ -z "${DIRECT_URL// }" ]]; then
            echo "::error::Missing DIRECT_URL GitHub Actions secret (Supabase session pooler URI, port 5432)."
            exit 1
          fi

      - name: Push Supabase SQL migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: supabase db push --yes --db-url "$DIRECT_URL"